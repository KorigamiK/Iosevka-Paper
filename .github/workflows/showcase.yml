name: Deploy Showcase

on:
    workflow_run:
        # Releases are created with GITHUB_TOKEN, which never fires the
        # `release` event — so chain off the release workflow instead.
        workflows: ["Iosevka Paper Release Workflow"]
        types: [completed]
    push:
        branches: [main]
        paths:
            - "site/**"
            - ".github/workflows/showcase.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        # For workflow_run triggers, only deploy when the release succeeded
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Download WOFF2 fonts from latest release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p site/public/fonts
                  gh release download --repo "$GITHUB_REPOSITORY" \
                      --pattern "IosevkaPaper-WOFF2-[0-9]*.zip" \
                      --dir /tmp/release
                  unzip -j /tmp/release/IosevkaPaper-WOFF2-*.zip "WOFF2/*.woff2" -d site/public/fonts
                  ls site/public/fonts

            - name: Bake release metadata
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/releases/latest" > site/public/release.json

            - name: Build site
              working-directory: site
              run: |
                  bun install
                  bun run build

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site/dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
