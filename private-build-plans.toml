[buildPlans.IosevkaPaper]
family = "Iosevka Paper"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.IosevkaPaper.variants]
  inherits = "ss01"

    [buildPlans.IosevkaPaper.variants.design]
    one = "no-base"
    three = "flat-top-serifless"
    four = "semi-open-serifless"
    five = "oblique-flat-serifless"
    six = "straight-bar"
    seven = "straight-serifless-crossbar"
    eight = "two-circles"
    nine = "straight-bar"
    zero = "tall-slashed"
    capital-c = "bilateral-inward-serifed"
    capital-d = "standard-serifless"
    capital-g = "toothless-corner-inward-serifed-hooked"
    capital-q = "crossing"
    capital-r = "standing-serifless"
    capital-v = "curly-serifless"
    capital-w = "curly-serifless"
    c = "bilateral-inward-serifed"
    f = "flat-hook-serifless"
    i = "serifed"
    j = "flat-hook-serifed"
    k = "curly-serifless"
    l = "serifed"
    m = "top-left-serifed"
    n = "straight-top-left-serifed"
    p = "eared-motion-serifed"
    q = "straight-motion-serifed"
    r = "serifless"
    t = "flat-hook"
    v = "curly-serifless"
    w = "curly-serifless"
    x = "straight-unilateral-motion-serifed"
    y = "straight-motion-serifed"
    z = "curly-serifless"
    lower-pi = "tailed"
    tittle = "square"
    diacritic-dot = "square"
    punctuation-dot = "square"
    tilde = "low"
    asterisk = "penta-mid"
    underscore = "high"
    paren = "flat-arc"
    brace = "curly-flat-boundary"
    ampersand = "upper-open"
    at = "fourfold"
    percent = "rings-segmented-slash"
    bar = "natural-slope"
    question = "corner"
    pilcrow = "high"
    decorative-angle-brackets = "middle"
    lig-neq = "slightly-slanted"
    lig-plus-chain = "with-notch"
    lig-double-arrow-bar = "with-notch"
    lig-single-arrow-bar = "with-notch"

    [buildPlans.IosevkaPaper.variants.italic]
    one = "no-base"
    three = "flat-top-serifless"
    four = "semi-open-serifless"
    five = "oblique-flat-serifless"
    six = "straight-bar"
    seven = "straight-serifless-crossbar"
    eight = "two-circles"
    nine = "straight-bar"
    zero = "slashed"
    capital-c = "bilateral-inward-serifed"
    capital-i = "serifed"
    capital-k = "symmetric-touching-serifless"
    capital-l = "motion-serifed"
    capital-v = "curly-serifless"
    capital-w = "curly-serifless"
    f = "flat-hook-serifless"
    i = "serifed-diagonal-tailed"
    j = "diagonal-tailed-serifed"
    k = "curly-top-left-serifed"
    l = "serifed-diagonal-tailed"
    m = "top-left-serifed"
    t = "flat-hook"
    v = "curly-serifless"
    w = "curly-serifless"
    x = "semi-chancery-curly-serifless"
    z = "curly-serifless"
    tittle = "square"
    diacritic-dot = "square"
    punctuation-dot = "square"
    tilde = "low"
    paren = "flat-arc"
    brace = "curly-flat-boundary"
    ampersand = "upper-open"
    at = "fourfold"
    percent = "rings-segmented-slash"
    bar = "natural-slope"
    decorative-angle-brackets = "middle"
    lig-neq = "slightly-slanted"
    lig-plus-chain = "with-notch"
    lig-double-arrow-bar = "with-notch"
    lig-single-arrow-bar = "with-notch"

  [buildPlans.IosevkaPaper.ligations]
  inherits = "dlig"

[buildPlans.IosevkaPaper.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaPaper.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaPaper.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaPaper.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaPaper.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
